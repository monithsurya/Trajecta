[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trajecta"
version = "0.1.0"
description = "A simulation-first robot-learning framework for experiment-driven evaluation, failure analysis, and adaptive control using MuJoCo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Monith Surya" }
]
keywords = [
    "robotics",
    "simulation",
    "reinforcement-learning",
    "experiment-orchestration",
    "adaptive-control"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "gymnasium>=0.29.0",
    "mujoco>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/monithsurya/Trajecta"
Repository = "https://github.com/monithsurya/Trajecta"
Issues = "https://github.com/monithsurya/Trajecta/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
video = [
    "opencv-python>=4.8,<5.0",
]
rl = [
    "stable-baselines3>=2.7.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roboforge = [
    "py.typed",
    "environments/assets/*.xml",
    "environments/assets/panda/*",
    "environments/assets/panda/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
